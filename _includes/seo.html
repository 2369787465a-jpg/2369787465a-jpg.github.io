{% assign seo_description = page.excerpt | default: site.description | strip_html | strip_newlines | escape %}
<title>{{ page.title | default: site.title | escape }}</title>
<meta name="description" content="{{ seo_description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:locale" content="{% if page.lang == 'zh' %}zh_CN{% else %}en_GB{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.lang == 'zh' %}<link rel="alternate" hreflang="en" href="{{ page.lang_switch_url | absolute_url }}"><link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">{% else %}<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}"><link rel="alternate" hreflang="zh-CN" href="{{ page.lang_switch_url | absolute_url }}">{% endif %}
